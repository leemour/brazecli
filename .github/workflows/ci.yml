name: CI

# The repo is public, so Actions minutes are free and the gate can sit on every PR.
# (nbzb runs its gate after merge instead — that is a private-repo billing workaround,
# not a pattern to copy here.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `node-version-file: .nvmrc`. That file can say `lts/*`, a moving target that
  # would jump majors under us without a commit.
  NODE_VERSION: "24"

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Before the tests, not after: `tests/machine-output.test.ts` runs the built binary, and
      # the typecheck deliberately emits no JavaScript — it used to overwrite the bundled entry
      # point with its own (`BUG-16`).
      - run: pnpm build
      - run: pnpm test

      # Reads the committed snapshot, never the network, so it gates every PR without making CI
      # depend on Postman's uptime. Fails when the catalog no longer matches the spec it claims
      # to come from, or when an endpoint arrives that nobody has classified (§12).
      - run: pnpm catalog:check

      # Rendered from the built CLI, so it must run after `pnpm build` above. Fails when someone
      # adds or renames a command and `docs/commands.md` still describes last week's CLI.
      - run: pnpm docs:check

      # The published version lives in the CLI manifest and is copied into three other files, one
      # of which is compiled into `braze --version` and the User-Agent. Bumping the manifest alone
      # ships a tool that reports a version that was never published.
      - run: pnpm version:check

  portability:
    name: Core runs outside Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile

      # Bundles core for a runtime with no builtins at all. Catches a Node dependency that
      # arrives through a package, where there is no source to lint.
      - run: pnpm portability:core

      # Second runtime, actually executing core rather than only bundling it.
      - run: pnpm smoke:bun

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        # The binary, not gitleaks-action: the action asks an organisation account for a licence
        # key, and the tool itself is MIT and needs none.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
