packages:
  - packages/*

# pnpm blocks dependencies' install scripts by default. Without this, esbuild never unpacks
# its platform binary and lefthook never installs the git hooks. The key has moved twice:
# `pnpm.onlyBuiltDependencies` in package.json (pnpm 10), then `onlyBuiltDependencies` here,
# and since pnpm 11 it is `allowBuilds` with an explicit boolean per package. The older
# spellings are read but no longer permit the build, so a fresh install fails closed with
# ERR_PNPM_IGNORED_BUILDS — which is what broke CI on every run before 2026-09-14.
allowBuilds:
  esbuild: true
  lefthook: true

minimumReleaseAgeExclude:
  - '@leemour/cli-core@0.5.0 || 0.6.0'
